name: Build and publish macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and package app
        run: Scripts/package-app.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/StorageKitInspector-macOS-arm64.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Storage Inspector ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            --latest
